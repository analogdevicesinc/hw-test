name: Run Test

inputs:
  set:
    # { "name": "adsp/bootstrap", "target": "..." }
    description: "Test set"
    default: ""
  github-token:
    description: "GitHub Token"
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Identify Python
      id: python
      shell: bash
      run: echo "version=$(python3 -c 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")')" >> "$GITHUB_OUTPUT"

    - name: Identify test
      id: test
      shell: bash
      env:
        set: ${{ inputs.set }}
      run: echo "name=$(jq -er '.name' <<< "$set")" >> "$GITHUB_OUTPUT"

    - name: Restore test dependencies
      id: dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: hw-test-${{ runner.os }}-${{ runner.arch }}-py${{ steps.python.outputs.version }}-${{ hashFiles('pyproject.toml', format('tests/{0}/requirements.txt', steps.test.outputs.name)) }}

    - name: Install test dependencies
      shell: bash
      env:
        name: ${{ steps.test.outputs.name }}
      run: |
        venv="$GITHUB_WORKSPACE/.venv"
        echo "venv=$venv" >> "$GITHUB_ENV"

        if [[ "${{ steps.dependencies.outputs.cache-hit }}" != "true" ]]; then
          # Static runners may retain this ignored directory between jobs. Clear
          # it when the dependency key changed before recreating the environment.
          python3 -m venv --clear "$venv"
          requirements=()
          [[ -f "tests/${name}/requirements.txt" ]] && requirements=(-r "tests/${name}/requirements.txt")
          "$venv/bin/python" -m pip install --disable-pip-version-check -e . "${requirements[@]}"
        fi

    - name: Run test
      shell: bash
      env:
        set: ${{ inputs.set }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # Run test
        source "$venv/bin/activate"
        [[ "${{ runner.debug }}" == "1" ]] && v="-v"
        pytest $v
