targets:
  RAL-01-SC598_EZKIT-01:
    resources:
      RemotePlace:
        name: "RAL-01-SC598_EZKIT-01"
      NetworkService:
        username: "labgrid-client"
        address: "10.75.142.187"

    drivers:
      - SerialDriver:
          name: serial
          bindings:
            port: uart

      - NetworkPowerDriver:
          name: power
          bindings:
            port: power

      - SSHDriver:
          name: ssh

      - FTDIGPIODriver:
          name: spi_boot
          bindings:
            gpio: pin-d0

      - FTDIGPIODriver:
          name: power_sense
          bindings:
            gpio: pin-d6

      - FTDIGPIODriver:
          name: boot_done
          bindings:
            gpio: pin-d5

      - OpenOCDDriver:
          name: openocd
          load_commands:
            - "source [find interface/ice1000.cfg]"
            - "source [find target/adspsc59x_a55.cfg]"
            - "set _TARGETNAME adspsc59x_a55_Proc0.cpu"
            - "source [find /tools/u-boot.tcl]"
            - "init"
            - "autoboot_elf"
            - "shutdown"

      - UBootDriver:
          name: uboot
          prompt: "=> "
          login_timeout: 240
          boot_timeout: 240
          bindings:
            console: serial
