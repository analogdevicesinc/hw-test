targets:
  MUN-01-SC598_EZKIT-03:
    resources:
      RemotePlace:
        name: "MUN-01-SC598_EZKIT-03"
      NetworkService:
        username: "labgrid-client"
        address: "10.44.3.42"

    drivers:
      - SerialDriver:
          name: serial
          bindings:
            port: console

      - NetworkPowerDriver:
          name: power
          bindings:
            port: power

      - SSHDriver:
          name: ssh

      - FTDIGPIODriver:
          name: spi_boot
          bindings:
            gpio: pin-d0

      - OpenOCDDriver:
          name: openocd
          load_commands:
            - "gdb port disabled"
            - "telnet port disabled"
            - "tcl port disabled"
            - "source [find interface/adi-dbgagent.cfg]"
            - "source [find target/adspsc59x_a55.cfg]"
            - "source [find /tools/u-boot.tcl]"
            - "init"
            - "autoboot_elf"
            - "shutdown"

      - UBootDriver:
          name: uboot
          prompt: "=> "
          login_timeout: 240
          boot_timeout: 240
          bindings:
            console: serial
