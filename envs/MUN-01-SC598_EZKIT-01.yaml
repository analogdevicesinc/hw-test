targets:
  MUN-01-SC598_EZKIT-01:
    resources:
      RemotePlace:
        name: "MUN-01-SC598_EZKIT-01"
      NetworkService:
        username: "labgrid-client"
        address: "10.44.3.61"

    drivers:
      - SerialDriver:
          name: serial
          bindings:
            port: console

      - NetworkPowerDriver:
          name: power
          bindings:
            port: power

      - SSHDriver:
          name: ssh

      - SerialDriver:
          name: boot_mode_serial
          bindings:
            port: boot-mode

      - SerialPortDigitalOutputDriver:
          name: spi_boot
          signal: dtr
          invert: true
          bindings:
            serial: boot_mode_serial

      - OpenOCDDriver:
          name: openocd
          load_commands:
            - "source [find interface/adi-dbgagent.cfg]"
            - "source [find target/adspsc59x_a55.cfg]"
            - "source [find /tools/u-boot.tcl]"
            - "init"
            - "autoboot_elf"
            - "shutdown"

      - UBootDriver:
          name: uboot
          prompt: "=> "
          login_timeout: 240
          boot_timeout: 240
          bindings:
            console: serial
