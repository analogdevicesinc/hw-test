# flavor -> role -> {artifact glob over run artifact names, file glob inside zip}

[br2.spl]
artifact = "*_defconfig"
file = "bootstrap/u-boot-spl"
[br2.uboot]
artifact = "*_defconfig"
file = "bootstrap/u-boot"
[br2.kernel]
artifact = "*_defconfig"
file = "bootstrap/Image"
[br2.dtb]
artifact = "*_defconfig"
file = "bootstrap/*.dtb"
[br2.emmc]
artifact = "*_defconfig"
file = "debug/emmc.img.gz"

[uboot.spl]
artifact = "*"
file = "u-boot-spl"
[uboot.uboot]
artifact = "*"
file = "u-boot"

[yocto.spl]
artifact = "*"
file = "u-boot-spl-*.elf"
[yocto.uboot]
artifact = "*"
file = "u-boot-proper-*.elf"
