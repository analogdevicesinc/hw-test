# flavor -> role -> {artifact glob over run artifact names, file glob inside zip}

[br2.spl]
artifact = "*_defconfig"
file = "bootstrap/u-boot-spl"
[br2.uboot]
artifact = "*_defconfig"
file = "bootstrap/u-boot"
[br2.kernel]
artifact = "*_defconfig"
file = "bootstrap/Image"
[br2.dtb]
artifact = "*_defconfig"
file = "bootstrap/*.dtb"
[br2.emmc]
artifact = "*_defconfig"
file = "debug/emmc.img.gz"

[uboot.spl]
artifact = "*"
file = "u-boot-spl"
[uboot.uboot]
artifact = "*"
file = "u-boot"

[yocto.spl]
artifact = "*"
file = "u-boot-spl-*.elf"
[yocto.uboot]
artifact = "*"
file = "u-boot-proper-*.elf"

[linux.kernel]
artifact = "*_defconfig-gcc-arm64"
file = "boot/Image"
[linux.dtb]
artifact = "dtb-gcc"
file = "dtb/arch/*/boot/dts/adi/*.dtb"
[linux.spl]
artifact = "*_defconfig*"
file = "u-boot-spl"
source = "br2"
[linux.uboot]
artifact = "*_defconfig*"
file = "u-boot"
source = "br2"
[linux.rootfs]
artifact = "*_defconfig*"
file = "rootfs.cpio.uboot"
source = "br2"

[sources.br2]
repository = "analogdevicesinc/br2-external"
backend = "release"
tag = "2026.02-1.1.1"
