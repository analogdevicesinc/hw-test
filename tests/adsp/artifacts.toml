["br2-external".spl]
artifact = "*_defconfig"
file = "bootstrap/u-boot-spl"
["br2-external".uboot]
artifact = "*_defconfig"
file = "bootstrap/u-boot"
["br2-external".kernel]
artifact = "*_defconfig"
file = "bootstrap/Image"
["br2-external".dtb]
artifact = "*_defconfig"
file = "bootstrap/*.dtb"
["br2-external".emmc]
artifact = "*_defconfig"
file = "debug/emmc.img.gz"

["u-boot".spl]
artifact = "*"
file = "u-boot-spl"
["u-boot".uboot]
artifact = "*"
file = "u-boot"

["lnxdsp-adi-meta".spl]
artifact = "*"
file = "u-boot-spl-*.elf"
["lnxdsp-adi-meta".uboot]
artifact = "*"
file = "u-boot-proper-*.elf"
["lnxdsp-adi-meta".spl-boot]
artifact = "*"
file = "u-boot-spl.ldr"
["lnxdsp-adi-meta".uboot-boot]
artifact = "*"
file = "u-boot.ldr"
["lnxdsp-adi-meta".fitImage]
artifact = "*"
file = "fitImage"
["lnxdsp-adi-meta".rootfs-spi]
artifact = "*"
file = "*minimal*.rootfs.ubi"

[linux.kernel]
artifact = "*_defconfig-gcc-arm64"
file = "boot/Image"
[linux.dtb]
artifact = "dtb-gcc"
file = "dtb/arch/*/boot/dts/adi/*.dtb"
[linux.spl]
artifact = "*_defconfig*"
file = "debug/u-boot-spl"
source = "br2-external"
[linux.uboot]
artifact = "*_defconfig*"
file = "debug/u-boot"
source = "br2-external"
[linux.rootfs]
artifact = "*_defconfig*"
file = "debug/rootfs.cpio.uboot"
source = "br2-external"
[linux.fitImage]
artifact = "*_defconfig*"
file = "debug/fitImage"
source = "br2-external"
[linux.rootfs-spi]
artifact = "*_defconfig*"
file = "debug/*.ubi"
source = "br2-external"
[linux.spl-boot]
artifact = "*_defconfig*"
file = "debug/u-boot-spl.ldr"
source = "br2-external"
[linux.uboot-boot]
artifact = "*_defconfig*"
file = "debug/u-boot.ldr"
source = "br2-external"

[sources.br2-external]
repository = "analogdevicesinc/br2-external"
backend = "release"
tag = "2026.02-1.1.1"
